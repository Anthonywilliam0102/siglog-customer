name: CI
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Contratos recebidos dos outros squads
        run: python scripts/validar_contratos.py
      - name: Testes (unit, integration, contract)
        run: pytest --cov=src --cov-report=xml   # suíte completa: unit, integration e contract
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  docker-security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simular checkout do Windows (CRLF no start.sh)
        # Em Windows com core.autocrlf=true o script chega com CRLF; a imagem precisa suportar isso.
        run: sed -i 's/$/\r/' scripts/start.sh && file scripts/start.sh
      - name: Docker build
        run: docker build -t siglog-customer:ci .
      - name: Smoke test da imagem (dependências de produção)
        # Pega o que os testes não pegam: módulo importado em produção mas ausente do requirements.txt.
        run: |
          docker run --rm siglog-customer:ci python -c "import src.api.main, src.infrastructure.outbox_publisher; print('imports ok')"
      - name: Smoke test da imagem (sobe a API na porta definida por PORT)
        run: |
          docker run -d --name api-smoke -p 9000:9000 -e PORT=9000 siglog-customer:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:9000/health && break; sleep 2; done
          curl -fsS http://localhost:9000/health || (docker logs api-smoke; exit 1)
          docker rm -f api-smoke
      - name: Trivy scan (imagem)
        # Container oficial do Trivy (evita depender de versão/tag de action).
        # Troque --exit-code para 1 quando o time quiser bloquear o pipeline em CRITICAL/HIGH.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 siglog-customer:ci

  publish:
    needs: [test, frontend, docker-security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cd.yml

  # SonarCloud: ativar depois de criar o projeto e o secret SONAR_TOKEN (ver docs/00_checklist.md)

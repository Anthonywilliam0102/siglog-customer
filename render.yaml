# Blueprint da API no Render (plano gratuito). Os segredos NÃO ficam aqui: preencha no painel (sync: false).
services:
  - type: web
    name: siglog-customer-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL        # Supabase, Session pooler (docs/15_supabase.md)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ORIGINS        # URL do front no Cloudflare Pages
        sync: false
      - key: TRACKING_MOCK
        value: "true"
      - key: METRICS_TOKEN       # /metrics exige este token na nuvem (valor gerado pelo Render; Prometheus local não usa)
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "true"            # aplica o Alembic (idempotente) a cada subida: cria as tabelas novas no Supabase sozinho
      # Opcional (adicione na aba Environment do serviço): SETTINGS_ENCRYPTION_KEY = chave Fernet, para a tela de Configurações guardar
      # chaves de API dos outros squads. Gere com: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Não defina JWT_SECRET: sem ele, tokens de desenvolvimento (HS256) são recusados e só valem os do Supabase.

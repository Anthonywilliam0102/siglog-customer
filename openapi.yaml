openapi: 3.1.0
info:
  title: SIG-Log Customer
  description: CRM, SAC & Portal do Cliente — Squad 06
  version: 0.1.0
paths:
  /me:
    get:
      tags:
      - sessão
      summary: Quem sou eu (perfil do token)
      operationId: get_me_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
        '401':
          description: Não autenticado
      security:
      - HTTPBearer: []
  /customers:
    get:
      tags:
      - clientes
      summary: Listar clientes
      operationId: list_customers_customers_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Itens por página (máx. 100)
          default: 50
          title: Limit
        description: Itens por página (máx. 100)
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Itens a pular
          default: 0
          title: Offset
        description: Itens a pular
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerOut'
                title: Response List Customers Customers Get
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '404':
          description: Não encontrado
        '422':
          description: Regra de negócio/validação
    post:
      tags:
      - clientes
      summary: UC01 – Cadastrar cliente
      operationId: post_customer_customers_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOut'
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '404':
          description: Não encontrado
        '422':
          description: Regra de negócio/validação
        '409':
          description: Documento já cadastrado
  /orders:
    get:
      tags:
      - pedidos
      summary: Listar pedidos
      operationId: list_orders_orders_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/PedidoStatus'

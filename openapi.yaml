        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Itens por página (máx. 100)
          default: 50
          title: Limit
        description: Itens por página (máx. 100)
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Itens a pular
          default: 0
          title: Offset
        description: Itens a pular
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderOut'
                title: Response List Orders Orders Get
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '404':
          description: Não encontrado
        '422':
          description: Regra de negócio/validação
    post:
      tags:
      - pedidos
      summary: UC03 – Criar pedido a partir de cotação
      operationId: post_order_orders_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderOut'
        '401':
          description: Não autenticado
        '403':
          description: Acesso negado
        '404':
          description: Não encontrado
        '422':
          description: Regra de negócio/validação
        '409':
          description: Cotação já usada
  /tickets:

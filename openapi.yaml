components:
  schemas:
    ClaimIn:
      properties:
        order_id:
          type: string
          format: uuid
          title: Order Id
        tipo:
          type: string
          maxLength: 30
          minLength: 2
          title: Tipo
          examples:
          - AVARIA
        descricao:
          type: string
          minLength: 3
          title: Descricao
        valor_reclamado:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          title: Valor Reclamado
      type: object
      required:
      - order_id
      - tipo
      - descricao
      - valor_reclamado
      title: ClaimIn
    ClaimOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        order_id:
          type: string
          format: uuid
          title: Order Id
        customer_id:
          type: string
          format: uuid
          title: Customer Id
        tipo:
          type: string
          title: Tipo
        descricao:
          type: string
          title: Descricao
        valor_reclamado:
          type: string
          title: Valor Reclamado
        status:
          type: string
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - order_id
      - customer_id
      - tipo
      - descricao
      - valor_reclamado
      - status
      - created_at
      title: ClaimOut
    CustomerIn:
      properties:
        nome:
          type: string
          maxLength: 200
          minLength: 2
          title: Nome
          examples:
          - Loja Exemplo Ltda
        documento:
          type: string
          title: Documento
          description: CPF (PF) ou CNPJ (PJ)
          examples:
          - '11222333000181'
        tipo:
          type: string
          pattern: ^(PF|PJ)$
          title: Tipo
          examples:
          - PJ
        email:
          type: string
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
          examples:
          - contato@exemplo.com
        telefone:
          anyOf:
          - type: string
          - type: 'null'
          title: Telefone
        endereco:
          anyOf:
          - type: string
          - type: 'null'
          title: Endereco
        owner_sub:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Sub
          description: 'Somente equipe: id do usuário dono do cadastro'
      type: object
      required:
      - nome
      - documento
      - tipo
      - email
      title: CustomerIn
    CustomerOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        nome:
          type: string
          title: Nome
        documento:
          type: string
          title: Documento
        tipo:
          type: string
          title: Tipo
        email:
          type: string
          title: Email
        telefone:
          anyOf:
          - type: string
          - type: 'null'
          title: Telefone
        endereco:
          anyOf:
          - type: string
          - type: 'null'
          title: Endereco
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - nome
      - documento
      - tipo
      - email
      - telefone
      - endereco
      - created_at
      title: CustomerOut
    DetalheOut:
      properties:
        rotulo:
          type: string
          title: Rotulo
        valor:
          type: string
          title: Valor
      type: object
      required:
      - rotulo
      - valor
      title: DetalheOut
    FeedbackIn:
      properties:
        target:
          $ref: '#/components/schemas/FeedbackTarget'
        nota:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Nota
        comentario:
          anyOf:
          - type: string
          - type: 'null'
          title: Comentario
        order_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
